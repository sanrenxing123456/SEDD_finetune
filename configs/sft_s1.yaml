seed: 42
pretrained_model: louaaron/sedd-small
data_dir: data/s1k_1_1_sedd
output_dir: exp_local/sedd_s1_sft

training:
  epochs: 3
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  ema: 0.9999
  sampling_eps: 1e-3
  time_samples_per_example: 10
  eval_time_samples_per_example: 10
  precision: bf16
  num_workers: 0
  log_every: 10
  eval_every: 250
  save_every: 250
  keep_step_checkpoints: 2
  max_eval_batches: 50
  resume_from: null

sampling:
  predictor: analytic
  steps: 128
  max_blocks: 8
